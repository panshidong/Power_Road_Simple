[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "austin-recovery-runtime"
version = "0.1.0"
description = "Independent Austin power-road recovery experiments A, B and C"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "networkx>=3.4,<4", "OpenDSSDirect.py==0.9.4", "matplotlib>=3.9,<4"]

[project.scripts]
austin-recovery = "austin_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["austin_runtime*"]
